<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WIGAME Project Map V1.8</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}header{height:64px;background:#111827;color:white;display:flex;align-items:center;padding:0 22px;gap:24px}.brand{font-size:21px;font-weight:800}.brand small{font-size:11px;color:#9ca3af}.tabs{display:flex;gap:5px}.tab,.btn{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.tab{background:transparent;color:#aeb7c6;font-weight:700}.tab.active{background:#263246;color:#fff}.btn{margin-left:auto;background:#263246;color:#fff}.view{display:none;height:calc(100vh - 64px)}.view.active{display:block}#map{position:relative;width:100%;height:100%;overflow:auto;background-image:radial-gradient(#cfd6e4 1px,transparent 1px);background-size:24px 24px}.canvas{position:relative;width:1800px;height:1200px}.node{position:absolute;width:265px;background:white;border:1px solid #d9dfeb;border-radius:14px;box-shadow:0 7px 22px #26324a14;cursor:grab;user-select:none;z-index:2}.node h3{margin:0;font-size:16px}.head{padding:13px 15px;border-bottom:1px solid #eef1f6}.meta{font-size:12px;color:#667085;margin-top:5px}.body{padding:11px 15px;font-size:12px}.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0}.row b{text-align:right}.badge{display:inline-block;background:#edf3ff;color:#315fc4;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700}.root{background:#111827;color:#fff;width:210px}.root .meta{color:#bbc3cf}svg{position:absolute;width:1800px;height:1200px;z-index:1;pointer-events:none}.drawer{position:fixed;right:0;top:64px;width:420px;height:calc(100vh - 64px);background:white;border-left:1px solid #d9dfeb;padding:22px;overflow:auto;transform:translateX(105%);transition:.2s;z-index:9}.drawer.open{transform:none}.close{float:right;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.section{margin-top:22px}.section h4{font-size:11px;color:#7b8496;letter-spacing:.08em;text-transform:uppercase}.sub{border:1px solid #d9dfeb;border-radius:10px;padding:11px;margin:9px 0}.sub small{display:block;color:#667085;margin-top:4px}.member{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f6}.page{overflow:auto;padding:26px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.panel{background:white;border:1px solid #d9dfeb;border-radius:13px;padding:16px}.panel h3{margin-top:0}.tiny{font-size:12px;color:#667085;line-height:1.6}.bar{height:7px;background:#e9edf5;border-radius:20px;margin:9px 0 12px}.bar i{display:block;height:100%;background:#356ae6;border-radius:20px}.hint{position:fixed;left:18px;bottom:18px;background:white;border:1px solid #d9dfeb;border-radius:10px;padding:9px 12px;font-size:11px;color:#667085;z-index:5}</style></head><body>
<header><div class="brand">WIGAME <small>PROJECT PORTFOLIO</small></div><div class="tabs"><button class="tab active" data-v="mapv">Project Map</button><button class="tab" data-v="partnerv">Partner View</button><button class="tab" data-v="loadv">Team Load</button></div><button class="btn" id="reset">Reset layout</button></header>
<section id="mapv" class="view active"><div id="map"><div class="canvas" id="canvas"><svg id="svg"></svg></div></div><div class="hint">Kéo thả project • Click để xem sub-project/partner/team • Vị trí tự lưu</div><aside class="drawer" id="drawer"></aside></section>
<section id="partnerv" class="view page"><h2>Partner View</h2><p class="tiny">Partner được lấy từ từng sub-project.</p><div class="grid" id="partners"></div></section>
<section id="loadv" class="view page"><h2>Team Workload</h2><p class="tiny">Đếm theo project cấp cao, không cộng sub-project.</p><div class="grid" id="loads"></div></section>
<script>
const PROGRESS={"platform":{"Viettel Media":["Campuchia & Lào đã test xong, cuối tháng 9 chốt timeline.","Peru 28/09 test tiếng TBN → done sẽ chốt sớm."],"TV360 Mobile & TV":["Tech nội bộ done.","Kết nối với 360 done trước 10/10.","Tiến hành song song với update giấy phép."],"Tammi Game Portal":["Đã tạo mini app test.","Chờ go-live T10."],"Dplus Game Portal":["Đã họp thống nhất phương án kỹ thuật.","Trong tuần 25/09 chốt kịch bản/giá gói với VNPT."],"FPT Play Game Portal":["Chưa có thêm info, miss add luồng mail chỗ a Đạt."]},"lotus":{"Lotus Runner":["Vẫn bám theo lịch 1/10 start nghiệm thu. 15/10 go live.","Art chậm do đối tác đổi & chưa chốt được nhân vật Mascot 3D.","Cancel các thay đổi/thêm mới ảnh hưởng tới deadline nghiệm thu."]}};
const PROJECT_UPDATES={"tammi-gami":["Tammi Homie: Target 10/10 go-live.","Tammi Tết: 25/09 họp idea lần 2.","Tammi Tết: Target có Tết Dương, Tết Âm; focus buff call/chat.","Đã báo giá chung gói khoảng 1,6 tỷ."],"tv360":["Tháng 10 target xong 2 game."],"dv":["Họp online và ký NDA.","30/09 họp tại IPH VN.","Đối tác quan tâm tự mở dịch vụ với Viettel, Mobifone. Phần tỷ lệ của telcos hiện tại đang thấp, cần có phương án."],"myid":["Update xong version mới MyID Go.","Cuối tháng 10 update theme/tính năng.","30/09 gửi list game mới."],"tammi-aff":["Đã build xong mini app gửi đối tác test.","KD đã trình đề xuất 85%.","Chuẩn bị kết nối sẵn các đối tác game G1 ở VN cho Tammi trong T10."],"mmo":["Proposal 3 game online tại Myanmar: 25/09."],"exscape":["Đối tác đang đề xuất tỷ lệ cao 70% → cần hạ sâu + xem thị trường phù hợp mô hình.","Đối tác mới giới thiệu thêm mảng Short Drama."],"khac":["Proposal Campuchia với DND: a Đạt/Danny xem bổ sung mảng; Nam care game.","Đánh giá lại bảng tỷ lệ % hợp tác trên Tammi – Chính sách Affiliate / Channeling Game.","Hợp tác phát triển, kinh doanh game G234–G1 mới; công ty xin bản quyền và giấy phép.","Trao đổi line co-pub với đối tác game TikTok Ayi."]};
const PROJECT_NOTES={"platform":["A Quảng vẫn tiếp tục triển khai với TV360.","Toàn bộ các dự án liên quan platform A Thịnh & A Tuấn Anh xử lý."]};
const PERSON_META={"Vỹ":"CTV outsource","Duyệt":"CTV outsource","Quảng":"HCM"};
const P=[{"id":"platform","name":"Platform Game","pm":"Dũng","partner":"Nhiều đối tác","goal":"Platform / cổng game đa thị trường","timeline":"T9–T11/2026","team":[["Dũng","PM"],["Thịnh","Backend"],["Quảng","Backend"],["Tuấn Anh","Frontend"]],"subs":[["Viettel Media","Viettel Media","Cambodia Mobile • Laos Mobile • Peru Mobile & TV","T11/2026"],["TV360 Mobile & TV","TV360 – Viettel","Game TV360 Mobile & TV","T9 hoặc T10/2026"],["Tammi Game Portal","Tammi Viettel","Cổng game trên Tammi","T10/2026"],["Dplus Game Portal","DND × VNPT","Cổng game trên Dplus","T11/2026"],["FPT Play Game Portal","FPT","Cổng game FPT Play","T11/2026"]]},{"id":"tammi-gami","name":"Tammi Gamification","pm":"Đạt","partner":"Tammi – Viettel","goal":"Gamification trên Tammi","timeline":"T10–T12/2026","team":[["Đạt","PM"],["Vỹ","Backend"],["Tuấn Anh","Frontend"],["Duyệt","Artist"]],"subs":[["Tammi Homie – OA","Tammi – Viettel","Gamification trên Tammi OA","T10/2026"],["Tammi Homie – Tết","Tammi – Viettel","Gamification Tết Dương / Âm","T12/2026"]]},{"id":"tv360","name":"Gamehub TV360","pm":"Đạt","partner":"TV360 – Viettel","goal":"Cổng gamification trên TV360","timeline":"T10/2026","team":[["Đạt","PM"],["Vỹ","Backend"],["Tuấn Anh","Frontend"],["Ánh","Artist"]],"subs":[["TV360 Gamification Hub","TV360 – Viettel","Cổng gamification trên TV360","T10/2026"]]},{"id":"mmo","name":"MMO","pm":"Nam","partner":"Gamota / Gigantic / Lava","goal":"Danh mục game MMO hợp tác đối tác","timeline":"TBD","team":[["Nam","PM"],["Dũng","BD"]],"subs":[["3Q GAB029","Gamota","Game 3Q GAB029","TBD"],["Gunbow","Gigantic","Game Gunbow","TBD"],["Cổ Phong 3Q","Lava","Game Cổ Phong 3Q","TBD"]]},{"id":"lotus","name":"Lotus Runner","pm":"Dũng","partner":"Vietnam Airlines","goal":"Gamification trên app Lotus Smile","timeline":"15/T10/2026","team":[["Dũng","PM"],["Hưng","Artist"],["Thịnh","Backend"],["Tuấn Anh","Frontend"]],"subs":[["Lotus Runner","Vietnam Airlines","Gamification trên app Lotus Smile","15/T10/2026"]]},{"id":"myid","name":"MyID – Mytel Myanmar","pm":"Dũng","partner":"Mytel – Viettel","goal":"Gamification trên app MyID","timeline":"T10–T12/2026","team":[["Dũng","PM"],["Thịnh","Backend"],["Tuấn Anh","Frontend"]],"subs":[["MyID Go","Mytel – Viettel","Gamification trên app MyID – update mới","T10/2026"],["Game List Suggest","Mytel – Viettel","Update game mới trên MyID","T12/2026"]]},{"id":"tammi-aff","name":"Tammi Affiliate Game","pm":"Nam","partner":"Tammi","goal":"Cổng game Affiliate trên Tammi","timeline":"T10/2026","team":[["Nam","PM"],["Thịnh","Backend"],["Tuấn Anh","Frontend"],["Đạt","BD"]],"subs":[["Affiliate Game Portal","Tammi","Cổng game Affiliate trên Tammi","T10/2026"]]},{"id":"dv","name":"Game Digital Virgo","pm":"Nam","partner":"Digital Virgo","goal":"Hợp tác Cổng Game DV và Short Drama","timeline":"T1 hoặc T2/2027","team":[["Nam","PM"],["Đạt","BD"]],"subs":[["DV Game Portal","Digital Virgo","Hợp tác Cổng Game DV","T1 hoặc T2/2027"],["Short Drama","Digital Virgo","Hợp tác Short Drama","T1 hoặc T2/2027"]]},{"id":"khac","name":"Khác","pm":"Nam / Đạt","partner":"Nhiều đối tác","goal":"Business / Proposal / Chính sách / Cơ hội hợp tác mới","timeline":"Đang triển khai","team":[["Nam","Game / Business"],["Đạt","BD"]],"subs":[["Proposal Campuchia","DND","Proposal Campuchia; a Đạt/Danny bổ sung mảng phù hợp; Nam care game","TBD"],["Affiliate / Channeling Game","Tammi","Đánh giá lại bảng tỷ lệ % hợp tác trên Tammi","TBD"],["Game G234 – G1 mới","Đối tác game","Hợp tác phát triển & kinh doanh; công ty xin bản quyền và giấy phép","TBD"],["TikTok Game Co-pub","Ayi","Trao đổi line co-pub với đối tác game TikTok Ayi","TBD"]]},{"id":"exscape","name":"EXSCAPE","pm":"Đang deal","partner":"Dreamscript Technologies","goal":"Game portal & Short Drama","timeline":"TBD","team":[],"subs":[["Game Portal","Dreamscript Technologies","Game portal","TBD"],["Short Drama","Dreamscript Technologies","Short drama","TBD"]]}],C=document.getElementById('canvas'),S=document.getElementById('svg'),D=document.getElementById('drawer');
const DEF={root:[60,480],platform:[350,70],"tammi-gami":[350,270],tv360:[350,470],mmo:[350,670],lotus:[720,70],myid:[720,270],"tammi-aff":[720,470],dv:[720,670],khac:[1090,70],exscape:[1090,270]};let POS=JSON.parse(localStorage.getItem('wigameV1')||'null')||DEF;
function node(id,name,pm,partner,time,root=false){let n=document.createElement('div');n.className='node'+(root?' root':'');n.dataset.id=id;let q=POS[id]||[300,300];n.style.left=q[0]+'px';n.style.top=q[1]+'px';n.innerHTML=`<div class="head"><h3>${name}</h3><div class="meta">${root?'Company / Portfolio':'PM: <b>'+pm+'</b>'}</div></div>${root?'':`<div class="body"><div class="row"><span>Partner</span><b>${partner}</b></div><div class="row"><span>Go-live</span><b>${time}</b></div><span class="badge">View detail</span></div>`}`;C.appendChild(n);drag(n);if(!root)n.onclick=()=>{if(!n.moved)detail(P.find(x=>x.id===id))}}
node('root','WIGAME','','','',true);P.forEach(p=>node(p.id,p.name,p.pm,p.partner,p.timeline));
function ctr(n){return[n.offsetLeft+n.offsetWidth/2,n.offsetTop+n.offsetHeight/2]}function lines(){S.innerHTML='';let a=ctr(document.querySelector('[data-id=root]'));P.forEach(p=>{let b=ctr(document.querySelector(`[data-id="${p.id}"]`)),x=document.createElementNS('http://www.w3.org/2000/svg','path');x.setAttribute('d',`M${a[0]},${a[1]} C${a[0]+120},${a[1]} ${b[0]-120},${b[1]} ${b[0]},${b[1]}`);x.setAttribute('fill','none');x.setAttribute('stroke','#c8d0de');x.setAttribute('stroke-width','2');S.appendChild(x)})}
function drag(n){let sx,sy,ox,oy,on=false;n.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;ox=n.offsetLeft;oy=n.offsetTop;on=true;n.moved=false;n.setPointerCapture(e.pointerId)};n.onpointermove=e=>{if(!on)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)n.moved=true;n.style.left=ox+dx+'px';n.style.top=oy+dy+'px';lines()};n.onpointerup=()=>{on=false;POS[n.dataset.id]=[n.offsetLeft,n.offsetTop];localStorage.setItem('wigameV1',JSON.stringify(POS))}}
function detail(p){D.classList.add('open');let subs=p.subs.length?p.subs.map(s=>{let ups=(PROGRESS[p.id]&&PROGRESS[p.id][s[0]])||[];return `<div class="sub">${ups.length?`<div style="color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:9px 10px;margin-bottom:10px;line-height:1.55"><b>UPDATE TIẾN ĐỘ</b>${ups.map(u=>`<div>• ${u}</div>`).join('')}</div>`:''}<b>${s[0]}</b><small>Partner: ${s[1]}</small><small>${s[2]}</small><small>Go-live: <b>${s[3]}</b></small></div>`}).join(''):'<div class="tiny">Chưa bổ sung.</div>';let notes=(PROJECT_NOTES[p.id]||[]);D.innerHTML=`<button class="close" onclick="D.classList.remove('open')">✕</button><div class="meta">PROJECT</div><h2>${p.name}</h2><span class="badge">PM · ${p.pm}</span>${PROJECT_UPDATES[p.id]&&PROJECT_UPDATES[p.id].length?`<div class="section"><h4>Update tiến độ</h4><div style="color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6">${PROJECT_UPDATES[p.id].map(u=>`<div>• ${u}</div>`).join('')}</div></div>`:''}<div class="section"><h4>Overview</h4><div class="row"><span>Partner</span><b>${p.partner}</b></div><div class="row"><span>Objective</span><b>${p.goal}</b></div><div class="row"><span>Timeline</span><b>${p.timeline}</b></div></div><div class="section"><h4>Sub-project / Partner (${p.subs.length})</h4>${subs}</div>${notes.length?`<div class="section"><h4>Note chung dự án</h4><div style="background:#f8fafc;border:1px solid #d9dfeb;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6">${notes.map(n=>`<div>• ${n}</div>`).join('')}</div></div>`:''}<div class="section"><h4>Team</h4>${p.team.length?p.team.map(m=>`<div class="member"><span>${m[0]}${PERSON_META[m[0]]?` <small style="color:#667085">· ${PERSON_META[m[0]]}</small>`:''}</span><b>${m[1]}</b></div>`).join(''):'<div class="tiny">PM / nhân sự: đang deal, chưa chốt.</div>'}</div>`}
function load(){let m={};P.forEach(p=>p.team.forEach(a=>{m[a[0]]??={ps:new Set(),roles:new Set(),pm:0};m[a[0]].ps.add(p.name);m[a[0]].roles.add(a[1]);if(a[1]=='PM')m[a[0]].pm++}));let mx=Math.max(...Object.values(m).map(x=>x.ps.size));document.getElementById('loads').innerHTML=Object.entries(m).sort((a,b)=>b[1].ps.size-a[1].ps.size).map(([n,x])=>`<div class="panel"><h3>${n}</h3>${PERSON_META[n]?`<div class="badge">${PERSON_META[n]}</div><br><br>`:''}<b>${x.ps.size} projects</b> · ${x.pm} PM<div class="bar"><i style="width:${x.ps.size/mx*100}%"></i></div><div class="tiny">${[...x.roles].join(' / ')}</div><div class="tiny">${[...x.ps].join(' • ')}</div></div>`).join('')}
function partners(){let m={};P.forEach(p=>p.subs.forEach(s=>{m[s[1]]??=[];m[s[1]].push(`${p.name} → ${s[0]}`)}));document.getElementById('partners').innerHTML=Object.entries(m).map(([n,a])=>`<div class="panel"><h3>${n}</h3><div class="tiny">${a.join('<br>')}</div></div>`).join('')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.v).classList.add('active')});document.getElementById('reset').onclick=()=>{localStorage.removeItem('wigameV1');location.reload()};load();partners();lines();
</script></body></html>
